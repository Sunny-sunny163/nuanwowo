<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#B77A62"><title>暖窝窝 · 本地体验版</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#24372d;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:#587663;color:white;padding:11px 14px}button.secondary{background:#e5ece7;color:#355440}button.ghost{background:transparent;color:#47624f}button:disabled{opacity:.45}input,textarea,select{border:1px solid #d5ddd5;border-radius:10px;background:#fff;padding:10px;width:100%;color:#24372d}label{display:block;font-size:13px;color:#5d7164;margin:10px 0 6px}.app{max-width:960px;margin:auto;min-height:100dvh;padding:18px 16px 98px}.header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}.subtitle{color:#7b897f;font-size:12px}.header h1{font-size:25px;margin:4px 0}.card{border-radius:17px;background:white;padding:16px;margin:10px 0;box-shadow:0 2px 12px #2a443008}.soft{background:#eaf0e9}.title{font-size:19px;font-weight:700;margin:20px 0 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eaf0e9;border-radius:14px;padding:14px 8px;text-align:center}.stat strong{display:block;font-size:26px}.muted{font-size:12px;color:#7a897f}.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eff1ed;padding:12px 0}.task:last-child{border:0}.taskmain{flex:1}.taskname{font-weight:650}.pill{display:inline-block;border-radius:30px;background:#e9eee8;padding:4px 8px;font-size:11px;color:#4b6653}.late{background:#fff0e6;color:#aa5f32}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 11px;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e8e2;display:flex;justify-content:space-around;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:4}.nav button{background:none;color:#87948a;font-size:12px;padding:7px 10px}.nav button.active{color:#355d42;background:#eaf0e9}h2{font-size:20px;margin:5px 0 14px}.row{display:flex;align-items:center;gap:9px;justify-content:space-between}.stack{display:flex;flex-direction:column;gap:8px}.field{margin-bottom:12px}.tag{font-size:12px;color:#6e8274}.progress{height:8px;background:#dce7dc;border-radius:10px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#698f73}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.note{background:#fffaeb;padding:11px;border-radius:10px;font-size:12px;color:#78633d}.hide{display:none}.empty{padding:24px 10px;text-align:center;color:#8b978d}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;padding:10px 0;border-radius:9px;background:#fff;min-height:44px}.day.pick{background:#587663;color:#fff}.day small{display:block;font-size:9px;opacity:.7}.page{display:none}.page.active{display:block}@media(min-width:720px){.app{padding:28px 24px 100px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.card{margin:0 0 12px}}
.edit-overlay{position:fixed;inset:0;background:#18291fb0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.edit-overlay.hide{display:none}.edit-panel{background:#fff;border-radius:18px;padding:20px;width:min(100%,490px);max-height:90dvh;overflow:auto;box-shadow:0 12px 50px #0003}.edit-panel h2{margin:0}.edit-panel .actions{margin-top:18px}
/* 暖窝窝视觉主题 V0.4 — 柔和奶油底色、杏茶暖色交互 */
:root{color:#503D35;background:#FBF7F1}
button{background:#AD765D}button.secondary{background:#F3E7DC;color:#81553F}button.ghost{color:#8A5B48}
input,textarea,select{border-color:#EADBD0;color:#503D35}
.subtitle{color:#987F70}.card{box-shadow:0 3px 16px #68432E0D}.soft,.stat{background:#F6EBE0}
.muted{color:#988277}.pill{background:#F2E8DE;color:#835F50}.late{background:#FDE8E0;color:#AB5747}
.nav{border-color:#F0E2D7}.nav button{color:#99887E}.nav button.active{background:#F6E9DE;color:#935B44}
.tag{color:#876F62}.progress{background:#F0E1D5}.fill{background:#B68067}.day.pick{background:#AD765D}
.note{background:#FFF5E7;color:#806347}.edit-overlay{background:#4D332B99}
.header h1{letter-spacing:.04em}.header .subtitle:last-child{color:#AD7D63}
.analysis-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.analysis-row label{margin:8px 0 5px}.bar-track{width:100%;height:16px;background:#f4eae2;border-radius:20px;overflow:hidden}.bar-value{background:#ad765d;height:100%;border-radius:20px}.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:13px 0 5px}.analysis-note{font-size:12px;color:#8a7369;margin-top:12px}.analysis-error{font-size:12px;color:#a54433}.analysis-title{margin:20px 0 10px}@media(max-width:380px){.analysis-row{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="header"><div><div class="subtitle">我们的小窝 · 本地体验版 V0.4</div><h1>🧡 暖窝窝</h1><div class="subtitle">把小家，慢慢过好。</div></div><button class="secondary" onclick="exportData()">导出备份</button></div>
<section id="home" class="page active"><div id="homebody"></div></section><section id="chores" class="page"><h2>家务清单</h2><div class="card"><div class="row"><b>添加家务</b><span class="muted">支持自定义周期</span></div><label>名称</label><input id="newTask" placeholder="如：整理玄关"><div class="grid"><div><label>周期类型</label><select id="newMode"><option value="interval">完成后间隔</option><option value="daily">固定每日</option><option value="ondemand">按需</option><option value="once">一次性</option></select></div><div><label>间隔天数</label><input id="newDays" type="number" min="1" value="7"></div></div><label>负责人</label><select id="newOwner"><option>共同</option><option>我</option><option>另一位成员</option></select><p><button onclick="addTask()">创建家务</button></p></div><div id="choreslist"></div></section>
<div id="editOverlay" class="edit-overlay hide" role="dialog" aria-modal="true" aria-labelledby="editTitle">
<div class="edit-panel"><div class="row"><h2 id="editTitle">编辑家务</h2><button class="ghost" onclick="closeEdit()">关闭 ×</button></div>
<input type="hidden" id="editId">
<label for="editName">家务名称</label><input id="editName" maxlength="80">
<label for="editOwner">责任人</label><select id="editOwner"><option>共同</option><option>我</option><option>另一位成员</option></select>
<div class="grid"><div><label for="editMode">周期类型</label><select id="editMode" onchange="syncEditMode()"><option value="interval">完成后间隔</option><option value="daily">固定每日</option><option value="ondemand">按需</option><option value="once">一次性</option></select></div><div><label for="editDays">间隔天数</label><input id="editDays" type="number" min="1" max="3650"></div></div>
<label for="editNext">下次计划日期</label><input id="editNext" type="date">
<p class="note">修改周期或下次日期只影响后续计划；历史完成记录保持原样。按需家务不产生到期提醒。</p>
<div class="actions"><button onclick="saveTaskEdit()">保存修改</button><button class="secondary" onclick="closeEdit()">取消</button></div></div></div>
<section id="ideas" class="page"><h2>家庭改善</h2><div class="card"><label>记录一个想法</label><input id="newIdea" placeholder="如：整理厨房清洁用品"><p><button onclick="addIdea()">保存到想法池</button></p></div><div id="ideaslist"></div></section>
<section id="calendar" class="page"><h2>日历与记录</h2><div class="card"><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹ 上月</button><b id="monthlabel"></b><button class="secondary" onclick="changeMonth(1)">下月 ›</button></div><div class="calendar" id="cal"></div></div><div id="dayrecords"></div></section>
<section id="family" class="page"><h2>家庭统计</h2>
<div class="card"><h3 id="analysisHeading">这个月，我们为小家花了多长时间</h3>
<div class="analysis-row"><div><label for="analysisWho">查看对象</label><select id="analysisWho" onchange="analysisWho=this.value;renderStats()"><option value="all">我们的小家</option><option value="me">我为小家</option><option value="other">另一位成员</option></select></div>
<div><label for="analysisRange">时间范围</label><select id="analysisRange" onchange="chooseAnalysisRange(this.value)"><option value="month">本月</option><option value="lastmonth">上个月</option><option value="week">最近7天</option><option value="days30">最近30天</option><option value="custom">自定义时间</option></select></div></div>
<div class="analysis-row"><div><label for="analysisFrom">开始日期</label><input type="date" id="analysisFrom" onchange="editAnalysisDates()"></div><div><label for="analysisTo">结束日期</label><input type="date" id="analysisTo" onchange="editAnalysisDates()"></div></div>
<div class="analysis-error" id="analysisError" role="alert"></div><div id="analysisContent"></div></div><div class="note">本地演示数据仅存在当前浏览器，不能与家人的手机同步。需要正式部署和登录才能真正家庭共享。</div><div id="stats"></div><div class="card"><h3>数据管理</h3><p class="muted">本地保存于浏览器，清理浏览器数据可能导致记录丢失。可导出 JSON 备份。</p><button class="secondary" onclick="exportData()">导出数据</button> <button class="secondary" onclick="document.getElementById('importFile').click()">导入数据</button><input id="importFile" type="file" accept="application/json" class="hide" onchange="importData(event)"></div></section>
</main><nav class="nav"> <button data-page="home" class="active" onclick="openPage('home')">⌂<br>首页</button><button data-page="chores" onclick="openPage('chores')">☑<br>家务</button><button data-page="ideas" onclick="openPage('ideas')">✦<br>改善</button><button data-page="calendar" onclick="openPage('calendar')">▦<br>日历</button><button data-page="family" onclick="openPage('family')">♧<br>家庭</button></nav>
<script>
const KEY='jiayouxu-v1-local';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({tasks:[{id:'bed',name:'更换床单被套',area:'卧室',mode:'interval',days:14,owner:'共同',next:today(),active:true},{id:'floor',name:'清洁地面',area:'客厅',mode:'interval',days:7,owner:'共同',next:today(),active:true},{id:'toilet',name:'清洁马桶',area:'卫生间',mode:'interval',days:7,owner:'共同',next:today(),active:true},{id:'litter',name:'清理猫砂盆',area:'宠物',mode:'daily',days:1,owner:'共同',next:today(),active:true},{id:'water',name:'清洗猫咪饮水机',area:'宠物',mode:'interval',days:7,owner:'共同',next:today(),active:true}],ideas:[{id:'idea1',name:'整理厨房清洁用品',status:'想法池'}],events:[],timer:null});let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}let selectedDay=today(),monthOffset=0;function save(){localStorage.setItem(KEY,JSON.stringify(state));render()};function openPage(p){document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===p));document.querySelectorAll('.nav button').forEach(el=>el.classList.toggle('active',el.dataset.page===p));render()};function modeLabel(t){return t.mode==='daily'?'每天':t.mode==='interval'?`每${t.days}天`:t.mode==='once'?'一次性':'按需'};function due(t){return t.active && t.mode!=='ondemand'&&t.next<=today()};function pending(){return state.tasks.filter(due).sort((a,b)=>a.next.localeCompare(b.next))};function taskRow(t,withActions=true){let late=t.next<today();return `<div class="task"><div class="taskmain"><div class="taskname">${escapeHtml(t.name)} ${late&&due(t)?'<span class="pill late">逾期</span>':''}</div><div class="muted">${escapeHtml(t.area)} · ${escapeHtml(t.owner)} · ${modeLabel(t)} · ${t.mode==='ondemand'?'按需':`下次 ${t.next}`}</div></div>${withActions?`<div class="actions"><button class="secondary" onclick="startTask('${t.id}')">开始</button><button onclick="finish('${t.id}')">完成</button></div>`:''}</div>`};
function renderHome(){let list=pending(),completeToday=state.events.filter(e=>e.kind==='complete'&&e.date===today()).length;let timer=state.timer;document.getElementById('homebody').innerHTML=`<div class="card soft"><div class="subtitle">${today()} · 今日概览</div><div class="stats"><div class="stat"><strong>${list.length}</strong><span class="muted">待办</span></div><div class="stat"><strong>${completeToday}</strong><span class="muted">今日完成</span></div><div class="stat"><strong>${list.filter(t=>t.next<today()).length}</strong><span class="muted">逾期</span></div></div></div>${timer?`<div class="card"><b>⏱ 正在计时：${escapeHtml(state.tasks.find(t=>t.id===timer.taskId)?.name||'任务')}</b><p class="muted">开始于 ${new Date(timer.startedAt).toLocaleString()}</p><div class="actions"><button onclick="finish('${timer.taskId}')">结束并完成</button><button class="secondary" onclick="cancelTimer()">取消计时</button></div></div>`:''}<div class="cols"><div><div class="title">待完成家务</div><div class="card">${list.length?list.map(t=>taskRow(t)).join(''):'<div class="empty">今日没有到期家务 🎉</div>'}</div><div class="actions"><button class="secondary" onclick="openPage('chores')">＋ 添加家务</button><button class="secondary" onclick="openPage('ideas')">✦ 记录改善</button></div></div><div><div class="title">家庭改善</div><div class="card">${state.ideas.filter(x=>x.status!=='已完成').slice(0,3).map(x=>`<div class="task"><div class="taskmain"><b>${escapeHtml(x.name)}</b><div class="muted">${escapeHtml(x.status)}</div></div></div>`).join('')||'<div class="empty">暂无改善想法</div>'}</div><div class="title">最近执行</div><div class="card">${state.events.slice(-4).reverse().map(e=>`<div class="task"><div class="taskmain">${escapeHtml(e.taskName)}<div class="muted">${e.date} · ${escapeHtml(e.executor||'我')} · ${e.minutes==null?'未记时长':e.minutes+'分钟'}</div></div></div>`).join('')||'<div class="empty">暂无执行记录</div>'}</div></div></div>`}
function renderChores(){document.getElementById('choreslist').innerHTML=state.tasks.map(t=>`<div class="card">${taskRow(t,false)}<div class="actions"><button class="secondary" onclick="startTask('${t.id}')">开始计时</button><button onclick="finish('${t.id}')">记录完成</button><button class="secondary" onclick="backfill('${t.id}')">历史补录</button><button class="secondary" onclick="editTask('${t.id}')">编辑设置</button><button class="ghost" onclick="toggleActive('${t.id}')">${t.active?'暂停':'恢复'}</button></div></div>`).join('')};function editTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;document.getElementById('editId').value=id;document.getElementById('editName').value=t.name;document.getElementById('editOwner').value=t.owner;document.getElementById('editMode').value=t.mode;document.getElementById('editDays').value=t.days||1;document.getElementById('editNext').value=t.next||today();syncEditMode();document.getElementById('editOverlay').classList.remove('hide')}
function closeEdit(){document.getElementById('editOverlay').classList.add('hide')}
function syncEditMode(){let mode=document.getElementById('editMode').value;document.getElementById('editDays').disabled=mode!=='interval';document.getElementById('editNext').disabled=mode==='ondemand'}
function saveTaskEdit(){let t=state.tasks.find(x=>x.id===document.getElementById('editId').value);if(!t)return;let name=document.getElementById('editName').value.trim(),owner=document.getElementById('editOwner').value,mode=document.getElementById('editMode').value,days=Number(document.getElementById('editDays').value),next=document.getElementById('editNext').value;if(!name)return alert('请填写家务名称');if(mode==='interval'&&(!Number.isInteger(days)||days<1||days>3650))return alert('间隔天数应为1到3650');if(mode!=='ondemand'&&(!/^\d{4}-\d{2}-\d{2}$/.test(next)||Number.isNaN(Date.parse(next))))return alert('请选择有效的下次计划日期');let changed=t.mode!==mode||t.days!==days||t.next!==next;if(changed&&!confirm('修改周期或计划日期后，将从新设置继续排期，历史记录不变。确认保存吗？'))return;t.name=name;t.owner=owner;t.mode=mode;t.days=mode==='daily'?1:days;if(mode!=='ondemand')t.next=next;closeEdit();save()}
function addTask(){let name=document.getElementById('newTask').value.trim(),mode=document.getElementById('newMode').value,days=Number(document.getElementById('newDays').value);if(!name||!Number.isInteger(days)||days<1)return alert('请输入名称和有效间隔天数');state.tasks.push({id:'t'+Date.now(),name,area:'自定义',mode,days,owner:document.getElementById('newOwner').value,next:today(),active:true});document.getElementById('newTask').value='';save()};function toggleActive(id){let t=state.tasks.find(x=>x.id===id);t.active=!t.active;save()};function startTask(id){if(state.timer&&state.timer.taskId!==id)return alert('当前已有计时任务，请先结束或取消');if(state.timer?.taskId===id)return alert('此任务已开始计时');state.timer={taskId:id,startedAt:new Date().toISOString()};save();openPage('home')};function cancelTimer(){if(!confirm('取消本次计时？'))return;state.timer=null;save()};function finish(id){let t=state.tasks.find(x=>x.id===id);let defaultMinutes=state.timer?.taskId===id?Math.max(0,Math.round((Date.now()-new Date(state.timer.startedAt).getTime())/60000)):null;let input=prompt('人工劳动时长（分钟，可留空，不计时）：',defaultMinutes===null?'':String(defaultMinutes));if(input===null)return;let minutes=input.trim()===''?null:Number(input);if(minutes!==null&&(!Number.isFinite(minutes)||minutes<0||minutes>1440))return alert('请输入0到1440之间的分钟数');let who=prompt('执行人（我 / 另一位成员 / 保洁 / 机器人）：','我');if(who===null)return;who=who.trim()||'我';let kind=who==='机器人'?'device':who==='保洁'?'service':'human';let now=new Date();state.events.push({id:'e'+Date.now(),taskId:id,taskName:t.name,date:today(),at:now.toISOString(),executor:who,kind,minutes,extra:t.mode!=='ondemand'&&t.next>today()});if(state.timer?.taskId===id)state.timer=null;if(t.mode==='once')t.active=false;else if(t.mode==='daily')t.next=addDays(today(),1);else if(t.mode==='interval')t.next=addDays(today(),t.days);save()};function backfill(id){let t=state.tasks.find(x=>x.id===id),date=prompt('填写实际完成日期（YYYY-MM-DD）：',today());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today()||Number.isNaN(Date.parse(date)))return alert('日期无效或晚于今天');let who=prompt('执行人：','我');if(who===null)return;let m=prompt('人工时长（分钟，选填）：','');if(m===null)return;let minutes=m.trim()===''?null:Number(m);if(minutes!==null&&(!Number.isFinite(minutes)||minutes<0||minutes>1440))return alert('时长无效');let hasLater=state.events.some(e=>e.taskId===id&&e.date>date);state.events.push({id:'e'+Date.now(),taskId:id,taskName:t.name,date,at:new Date().toISOString(),executor:who.trim()||'我',kind:'human',minutes,backfill:true});if(t.mode==='interval'&&!hasLater&&confirm('按此次补录日期重新计算下次到期日？（若已有人工改期，请取消）'))t.next=addDays(date,t.days);save()};
function renderIdeas(){document.getElementById('ideaslist').innerHTML=state.ideas.map(i=>`<div class="card"><div class="row"><b>${escapeHtml(i.name)}</b><span class="pill">${escapeHtml(i.status)}</span></div><label>改善进度</label><select onchange="changeIdea('${i.id}',this.value)">${['想法池','计划中','进行中','已完成','暂缓','放弃'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')};function addIdea(){let n=document.getElementById('newIdea').value.trim();if(!n)return;state.ideas.unshift({id:'i'+Date.now(),name:n,status:'想法池'});document.getElementById('newIdea').value='';save()};function changeIdea(id,status){state.ideas.find(x=>x.id===id).status=status;save()};
function renderCalendar(){let base=new Date(),month=new Date(base.getFullYear(),base.getMonth()+monthOffset,1),year=month.getFullYear(),mo=month.getMonth(),length=new Date(year,mo+1,0).getDate(),offset=new Date(year,mo,1).getDay();document.getElementById('monthlabel').textContent=`${year}年${mo+1}月`;let s=['日','一','二','三','四','五','六'].map(x=>`<div class="day" style="background:transparent;font-size:12px;color:#849589">${x}</div>`).join('');for(let i=0;i<offset;i++)s+='<div></div>';for(let n=1;n<=length;n++){let ds=`${year}-${String(mo+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;s+=`<button class="day ${selectedDay===ds?'pick':''}" onclick="selectedDay='${ds}';renderCalendar()">${n}<small>${state.events.filter(e=>e.date===ds).length||''}</small></button>`}document.getElementById('cal').innerHTML=s;let events=state.events.filter(e=>e.date===selectedDay);document.getElementById('dayrecords').innerHTML=`<h3>${selectedDay} 执行记录</h3><div class="card">${events.length?events.map(e=>`<div class="task"><div class="taskmain"><b>${escapeHtml(e.taskName)}</b><div class="muted">${escapeHtml(e.executor)} · ${e.minutes===null?'未记录时长':e.minutes+'分钟'}</div></div><button class="ghost" onclick="deleteEvent('${e.id}')">撤销</button></div>`).join(''):'<div class="empty">此日期暂无记录</div>'}</div>`};function changeMonth(d){monthOffset+=d;let m=new Date(new Date().getFullYear(),new Date().getMonth()+monthOffset,1);selectedDay=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-01`;renderCalendar()};function deleteEvent(id){if(!confirm('撤销这条执行记录？此本地体验版不会自动回滚后续周期。'))return;state.events=state.events.filter(e=>e.id!==id);save()};let analysisWho='all',analysisRange='month',analysisFrom='',analysisTo='';
const ld=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function timeBounds(kind){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),a,b;if(kind==='lastmonth'){a=new Date(y,m-1,1);b=new Date(y,m,0)}else if(kind==='week'||kind==='days30'){a=new Date(y,m,now.getDate()-(kind==='week'?6:29));b=now}else{a=new Date(y,m,1);b=now}return [ld(a),ld(b)]}
function chooseAnalysisRange(v){analysisRange=v;if(v!=='custom'){[analysisFrom,analysisTo]=timeBounds(v);document.getElementById('analysisFrom').value=analysisFrom;document.getElementById('analysisTo').value=analysisTo}renderStats()}
function editAnalysisDates(){analysisRange='custom';analysisFrom=document.getElementById('analysisFrom').value;analysisTo=document.getElementById('analysisTo').value;document.getElementById('analysisRange').value='custom';renderStats()}
function prettyMin(n){n=Math.round(n);let h=Math.floor(n/60),m=n%60;return h?h+'小时'+(m?m+'分钟':''):m+'分钟'}
function shortHours(n){return (Math.round(n/6)/10).toFixed(1)+'小时'}
function bars(records){if(!records.length)return '<div class="empty">该时段暂无已记录时长</div>';let max=Math.max(...records.map(x=>x[1]),1);return records.map(([name,mins])=>'<div><div class="bar-label"><span>'+escapeHtml(name)+'</span><strong>'+prettyMin(mins)+'</strong></div><div class="bar-track" role="img" aria-label="'+escapeHtml(name+' '+prettyMin(mins))+'"><div class="bar-value" style="width:'+Math.max(0,mins/max*100)+'%"></div></div></div>').join('')}
function renderStats(){
document.getElementById('analysisWho').value=analysisWho;document.getElementById('analysisRange').value=analysisRange;
let valid=/^\d{4}-\d{2}-\d{2}$/;let ok=valid.test(analysisFrom)&&valid.test(analysisTo)&&analysisFrom<=analysisTo&&analysisTo<=today();
document.getElementById('analysisError').textContent=ok?'':'请选择有效的时间段：开始日期不晚于结束日期，结束日期不晚于今天。';
const heading=analysisWho==='me'?'这段时间，我为小家花了多长时间':analysisWho==='other'?'这段时间，另一位成员为小家花了多长时间':analysisRange==='month'?'这个月，我们为小家花了多长时间':'这段时间，我们为小家花了多长时间';
document.getElementById('analysisHeading').textContent=heading;
if(!ok){document.getElementById('analysisContent').innerHTML='';document.getElementById('stats').innerHTML='';return}
let ev=state.events.filter(x=>x.date>=analysisFrom&&x.date<=analysisTo);
const human=x=>x.kind==='human'||(!x.kind&&!['保洁','机器人'].includes(x.executor));
let humans=ev.filter(human),picked=analysisWho==='all'?humans:humans.filter(x=>x.executor===(analysisWho==='me'?'我':'另一位成员'));
let timed=picked.filter(x=>typeof x.minutes==='number'&&Number.isFinite(x.minutes)&&x.minutes>=0);
let total=timed.reduce((a,x)=>a+x.minutes,0),missing=picked.length-timed.length;
let member=new Map(),task=new Map();for(let x of timed){let who=x.executor||'未注明',name=x.taskName||'未命名家务';member.set(who,(member.get(who)||0)+x.minutes);task.set(name,(task.get(name)||0)+x.minutes)}
let sorted=m=>Array.from(m.entries()).sort((a,b)=>b[1]-a[1]);
let dom='<div class="grid"><div class="stat"><strong>'+shortHours(total)+'</strong><span class="muted">已记录人工工时</span></div><div class="stat"><strong>'+timed.length+'</strong><span class="muted">有时长的执行记录</span></div></div>';
dom+='<p class="analysis-note">'+analysisFrom+' 至 '+analysisTo+'，包含起止当天</p>';
if(missing)dom+='<div class="note">'+missing+'条家务记录没有填写时长，不计入图表；未记录不等于劳动时间为零。</div>';
dom+='<h3 class="analysis-title">家庭成员工作时长 · 柱状图</h3>'+bars(sorted(member));
if(analysisWho==='all'&&total>0&&member.size>1)dom+='<p class="analysis-note">成员工时占比：'+sorted(member).map(([n,v])=>escapeHtml(n)+' '+Math.round(v/total*100)+'%').join(' · ')+'</p>';
dom+='<h3 class="analysis-title">时间花在哪些家务上</h3>'+bars(sorted(task));
dom+='<p class="analysis-note">按实际执行人统计，不以任务默认责任人代替执行人。多人共同完成时应分别记录个人时长。</p>';
document.getElementById('analysisContent').innerHTML=dom;
const minutes=kind=>ev.filter(x=>x.kind===kind&&typeof x.minutes==='number'&&Number.isFinite(x.minutes)&&x.minutes>=0).reduce((a,x)=>a+x.minutes,0);
document.getElementById('stats').innerHTML='<div class="card"><h3>其他执行方式</h3><div class="grid"><div class="stat"><strong>'+shortHours(minutes('device'))+'</strong><span class="muted">设备运行</span></div><div class="stat"><strong>'+shortHours(minutes('service'))+'</strong><span class="muted">保洁服务</span></div></div><p class="analysis-note">设备和保洁时间单独显示，绝不计入家庭成员人工工时。此处统计整个家庭，不随成员筛选变化。</p></div><div class="card"><b>记录完整性</b><p class="muted">所选日期内人工家务记录 '+humans.length+' 条，其中已填写时长 '+humans.filter(x=>typeof x.minutes==='number'&&Number.isFinite(x.minutes)&&x.minutes>=0).length+' 条。</p></div>';
}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='暖窝窝-本地备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};async function importData(ev){let f=ev.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.tasks)||!Array.isArray(v.events)||!Array.isArray(v.ideas))throw Error('格式错误');if(confirm('导入将覆盖当前浏览器的演示数据，确定吗？')){state=v;save()}}catch(e){alert('导入失败：'+e.message)}ev.target.value=''};function render(){renderHome();renderChores();renderIdeas();renderCalendar();renderStats()}[analysisFrom,analysisTo]=timeBounds('month');document.getElementById('analysisFrom').value=analysisFrom;document.getElementById('analysisTo').value=analysisTo;document.getElementById('analysisFrom').max=today();document.getElementById('analysisTo').max=today();render();
</script></body></html>
