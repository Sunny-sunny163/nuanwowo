name: Basic checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check v05.js
      - name: Check entrypoint wiring
        run: |
          grep -q 'src="v05.js"' index.html
          grep -q '本地体验版 V0.5' index.html
