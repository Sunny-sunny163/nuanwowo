name: Basic checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V0.5.1 JavaScript syntax
        run: node --check v051.js
      - name: Check UI wiring and core scenarios
        run: node --test tests/v051.test.cjs
